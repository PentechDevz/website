<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Intro loader: on the first page of a visit and on every refresh, skipped for reduced motion, and cleared after 8s even if the app never runs.
      try {
        var nav = performance.getEntriesByType("navigation")[0];
        var isReload = nav && nav.type === "reload";
        if ((isReload || !sessionStorage.getItem("pd-intro-seen")) && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          var root = document.documentElement;
          root.classList.add("has-loader", "is-loading");
          setTimeout(function () { root.classList.remove("has-loader", "is-loading"); }, 8000);
        }
      } catch (e) {}
    </script>
    <title>Pentech Devs</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
